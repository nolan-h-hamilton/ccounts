name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.pythonVersion }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
        pythonVersion: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pythonVersion }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux build requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: ".[test,h5ad]"

      - name: Test installed package
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c "import ccounts._native, anndata, h5py, pysam, scipy"
          python -I -m pytest -q --import-mode=importlib "${{ github.workspace }}/tests"

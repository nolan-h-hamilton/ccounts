name: wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.name }} Python ${{ matrix.pythonGroup }} wheels
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        pythonGroup: ['3.10-3.14', '3.15']
        platform:
          - name: linux-x86_64
            os: ubuntu-24.04
            arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: macos-arm64
            os: macos-15
            arch: arm64
          - name: macos-x86_64
            os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: dist
        env:
          CIBW_ARCHS: ${{ matrix.platform.arch }}
          CIBW_BUILD: ${{ matrix.pythonGroup == '3.15' && 'cp315-*' || 'cp310-* cp311-* cp312-* cp313-* cp314-*' }}

      - name: Build source distribution
        if: matrix.platform.name == 'linux-x86_64' && matrix.pythonGroup == '3.10-3.14'
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - name: Check PyPI file sizes
        run: |
          python - <<'PY'
          from pathlib import Path

          limitBytes = 100 * 1024 * 1024
          for path in [*Path("dist").glob("*.whl"), *Path("dist").glob("*.tar.gz")]:
              sizeBytes = path.stat().st_size
              if sizeBytes > limitBytes:
                  raise SystemExit(
                      f"{path.name}: {sizeBytes / 1024**2:.2f} MiB exceeds PyPI's 100 MiB limit"
                  )
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform.name }}-${{ matrix.pythonGroup }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

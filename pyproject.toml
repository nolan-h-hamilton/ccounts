[build-system]
requires = ["setuptools>=77", "Cython>=3.1.8,<3.3", "numpy>=2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ccounts"
version = "0.1.0a0"
description = "Genomic bin counting and explicit depth normalization"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "HTSLIB_LICENSE.txt", "HTSCODECS_LICENSE.md", "ZLIB_LICENSE.txt"]
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
h5ad = ["anndata>=0.11", "h5py>=3.8", "scipy>=1.15"]
test = ["pytest", "pysam>=0.23.3", "anndata>=0.11", "h5py>=3.8"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ccounts", "ccounts.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
test-extras = ["test", "h5ad"]
test-command = [
    'python -I -c "import ccounts._native, anndata, h5py, pysam, scipy"',
    'python -I -m pytest -q --import-mode=importlib {project}/tests',
]

[[tool.cibuildwheel.overrides]]
select = "*-manylinux*"
before-all = "dnf install -y zlib-devel"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = "apk add --no-cache zlib-dev"
